<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- BIOBUZZ A4 landscape TechDraw template. Editable fields use the
     freecad:editable namespace so DrawSVGTemplate.setEditFieldContent
     fills them per sheet. make_drawings.py composes its own exported
     sheet on top of this; the template keeps in-document TechDraw pages
     honest when the drawing doc is opened in the FreeCAD GUI. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:freecad="http://www.freecad.org/wiki/index.php?title=Svg_Namespace"
     width="297mm" height="210mm" viewBox="0 0 297 210">
  <rect x="0" y="0" width="297" height="210" fill="#ffffff"/>
  <rect x="6" y="6" width="285" height="198" fill="none"
        stroke="#000" stroke-width="0.5"/>
  <rect x="195" y="160" width="96" height="44" fill="none"
        stroke="#000" stroke-width="0.5"/>
  <line x1="195" y1="174" x2="291" y2="174" stroke="#000" stroke-width="0.3"/>
  <line x1="195" y1="182" x2="291" y2="182" stroke="#000" stroke-width="0.3"/>
  <line x1="195" y1="190" x2="291" y2="190" stroke="#000" stroke-width="0.3"/>
  <text x="197" y="165" font-size="2" font-family="sans-serif"
        fill="#555">PART</text>
  <text freecad:editable="PART_NAME" x="197" y="171" font-size="4"
        font-family="sans-serif" font-weight="bold">PART</text>
  <text x="197" y="180" font-size="2.8" font-family="sans-serif">
    <tspan>MATERIAL: </tspan><tspan freecad:editable="MATERIAL">TBD</tspan>
    <tspan>  SPEC: </tspan><tspan freecad:editable="SPEC">-</tspan>
  </text>
  <text x="197" y="188" font-size="2.8" font-family="sans-serif">
    <tspan>QTY </tspan><tspan freecad:editable="QTY">1</tspan>
    <tspan>  REV </tspan><tspan freecad:editable="REV">A</tspan>
    <tspan>  SCALE </tspan><tspan freecad:editable="SCALE">1:1</tspan>
  </text>
  <text x="197" y="197" font-size="2.6" font-family="sans-serif">
    <tspan>BIOBUZZ FTC | </tspan><tspan freecad:editable="DOC">DOC</tspan>
    <tspan> | SHEET </tspan><tspan freecad:editable="SHEET">1</tspan>
    <tspan> | </tspan><tspan freecad:editable="STATUS">UNVERIFIED</tspan>
  </text>
  <text x="10" y="196" font-size="2.8" font-family="sans-serif"
        fill="#333">ALL DIMENSIONS IN MILLIMETERS | THIRD-ANGLE PROJECTION</text>
  <text x="10" y="200.2" font-size="2.8" font-family="sans-serif"
        fill="#8a2b2b">PROTOTYPE / VERIFY BEFORE MANUFACTURING</text>
</svg>
