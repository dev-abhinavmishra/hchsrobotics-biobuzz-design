name: cad-verify

# Rebuilds every parametric FreeCAD subsystem doc + the master assembly and
# runs the selfcheck_overhaul* gate scripts. Any gate failure fails the
# check; results are also reported as annotations + a job summary.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cad-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the version docs/setup.md marks probe-verified.
  FREECAD_VERSION: "1.1.3"
  FREECAD_APPIMAGE: "FreeCAD_1.1.3-Linux-x86_64-py311.AppImage"
  FREECAD_HOME: "/home/runner/freecad-dist"

jobs:
  verify:
    name: FreeCAD build + selfcheck gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FreeCAD install
        id: freecad-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/freecad-dist
          key: freecad-${{ env.FREECAD_VERSION }}-x86_64-py311-v1

      - name: Install FreeCAD (AppImage extract, no FUSE needed)
        if: steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$FREECAD_HOME"
          cd "$FREECAD_HOME"
          curl -fL --retry 3 -o freecad.AppImage \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}"
          curl -fL --retry 3 -o SHA256.txt \
            "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/${FREECAD_APPIMAGE}-SHA256.txt"
          expected="$(awk '{print $1}' SHA256.txt)"
          echo "$expected  freecad.AppImage" | sha256sum -c -
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract > /dev/null
          rm freecad.AppImage SHA256.txt

      - name: Put freecadcmd on PATH
        run: echo "$FREECAD_HOME/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: freecadcmd --version

      - name: Build all subsystem docs + master
        run: |
          set -e
          for f in scripts/freecad/build_*.py; do
            echo "=================== $f ==================="
            freecadcmd "$f"
          done

      - name: Export STEP (feeds XPT gates)
        run: freecadcmd scripts/freecad/export_step.py

      - name: Commit regenerated artifacts
        run: |
          # The GIT*_tree_clean gates require a clean `git status`; regenerated
          # FCStd/exports are byte-different every run, so snapshot them in a
          # CI-local commit (never pushed). selfcheck_overhaul03.txt is tracked
          # but is always mid-rewrite during its own run, so it is untracked +
          # excluded here and ships as a build artifact instead.
          echo 'exports/selfcheck_overhaul*.txt' >> .git/info/exclude
          if git ls-files --error-unmatch exports/selfcheck_overhaul03.txt > /dev/null 2>&1; then
            git rm -q --cached exports/selfcheck_overhaul03.txt
          fi
          git add -A
          git -c user.email="cad-verify@localhost" -c user.name="cad-verify" \
            commit -qm "ci: regenerated cad artifacts" || echo "nothing new to commit"
          git status --porcelain

      - name: Run all selfcheck_overhaul gates
        # A failing gate exits non-zero and fails the check — these are the
        # repo's regression contract. Results also land in the job summary,
        # error annotations, and the uploaded artifact.
        run: bash scripts/validation/ci_selfcheck.sh

      - name: Upload selfcheck output + exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-verify-exports-${{ github.sha }}
          path: |
            exports/
            logs/ci/
          if-no-files-found: warn
