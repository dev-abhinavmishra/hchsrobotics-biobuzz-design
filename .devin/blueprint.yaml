# https://docs.devin.ai/onboard-devin/environment-yaml
# Repo blueprint: installs FreeCAD 1.1.3 headless — the repo pins 1.1.3
# (docs/setup.md, cad-verify CI); gate signatures are version-sensitive.
initialize:
  - name: install FreeCAD 1.1.3 AppImage
    run: |
      mkdir -p "$HOME/opt/fc113" && cd "$HOME/opt/fc113"
      curl -fsSL -o FreeCAD.AppImage \
        https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
      chmod +x FreeCAD.AppImage
      ./FreeCAD.AppImage --appimage-extract >/dev/null
      "$HOME/opt/fc113/squashfs-root/AppRun" freecadcmd --version
knowledge:
  - name: freecad
    contents: |
      # headless runner — do NOT use -c inline code (crashes); run script files
      ~/opt/fc113/squashfs-root/AppRun freecadcmd scripts/freecad/<script>.py
      # inside scripts: reuse QtCore.QCoreApplication.instance(); freecadcmd owns it
  - name: build
    contents: |
      # subsystem docs + master: build_<drivebase|electronics|hopper|intake|lift|turret|master_robot>.py
      ~/opt/fc113/squashfs-root/AppRun freecadcmd scripts/freecad/build_drivebase.py
  - name: test
    contents: |
      # gate scripts print PASS/FAIL and exit non-zero on failure;
      # or run them all: bash scripts/validation/ci_selfcheck.sh
      ~/opt/fc113/squashfs-root/AppRun freecadcmd scripts/freecad/selfcheck_overhaul03.py
  - name: drawings
    contents: |
      # env selectors: DRAWINGS_DOCS=..., DRAWINGS_MAX=N, DRAWINGS_PLATES_ONLY=1
      ~/opt/fc113/squashfs-root/AppRun freecadcmd scripts/freecad/make_drawings.py
  - name: lint
    contents: |
      # no linter configured; stdlib + FreeCAD-bundled modules only
      python3 -m py_compile scripts/freecad/*.py
